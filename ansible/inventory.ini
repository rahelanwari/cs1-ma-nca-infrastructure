# Ansible inventory - all servers that Ansible manages

# Workstations: static addresses in the reserved LAN range .10-.31
# (they can never be banned by the SOAR). Add a new workstation here.
[workstations]
ws01 ansible_host=192.168.10.10
ws02 ansible_host=192.168.10.11

[management]
mgmt01 ansible_host=192.168.20.10 ansible_connection=local

[firewalls]
fw01 ansible_host=192.168.20.1

[aws]
# db ansible_host=<private IP of the database server>   (added in block 3, after the VPN)

# Groups with the same login user
[linux:children]
workstations
management

[linux:vars]
ansible_user=student

[firewalls:vars]
ansible_user=admin