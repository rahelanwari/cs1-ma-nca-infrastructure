# =====================================================================
# UPDATES PIPELINE (block 7, REQ-NCA-P2-05)
# Installs the updates on all servers, centrally and automatically.
# - Starts every Sunday at 01:00 UTC (03:00 summer time), or by hand.
# - Job 1 (runner mgmt01): Ansible playbook updates.yml for ws01 and
#   mgmt01, one host at a time.
# - Job 2 (laptop runner, AWS credentials): the database server in AWS,
#   through AWS Systems Manager (no SSH needed).
# - Job 2 only starts when job 1 succeeded.
# The log of every run is the audit trail: which host got which updates.
# =====================================================================
name: Updates

on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

# Only one update run at a time
concurrency:
  group: updates
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  DB_NAME_TAG: innovatech-cs1-dev-mysql

jobs:
  # ------------------------------------------------------------------
  # Job 1: on-prem Linux hosts (ws01, mgmt01) with Ansible
  # ------------------------------------------------------------------
  netlab:
    name: Update NetLab hosts
    runs-on: [self-hosted, Linux]   # the runner on mgmt01
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        working-directory: ansible
        run: ansible-playbook updates.yml --syntax-check

      - name: Install updates (one host at a time)
        working-directory: ansible
        run: ansible-playbook updates.yml

  # ------------------------------------------------------------------
  # Job 2: database server in AWS via Systems Manager
  # ------------------------------------------------------------------
  database:
    name: Update database server
    runs-on: [self-hosted, Windows]   # laptop runner with AWS credentials
    needs: netlab
    defaults:
      run:
        shell: powershell
    steps:
      - name: Find the database instance
        run: |
          $id = aws ec2 describe-instances --region $env:AWS_REGION `
            --filters "Name=tag:Name,Values=$env:DB_NAME_TAG" "Name=instance-state-name,Values=running" `
            --query "Reservations[0].Instances[0].InstanceId" --output text
          if ($LASTEXITCODE -ne 0 -or $id -eq "None") { throw "Database instance not found" }
          echo "INSTANCE_ID=$id" >> $env:GITHUB_ENV
          Write-Host "Database instance: $id"

      - name: Install updates with SSM Run Command
        run: |
          # Amazon Linux 2023 is locked to a release; --releasever=latest
          # moves it to the newest release (advice of AWS).
          $commands = @(
            'set -eo pipefail',
            'echo "Release before: $(cat /etc/amazon-linux-release)"',
            'dnf upgrade -y --releasever=latest | tail -n 25',
            'echo "Release after:  $(cat /etc/amazon-linux-release)"',
            'echo "Updates still available: $(dnf check-update -q | grep -c "\." || true)"',
            'if dnf needs-restarting -r > /dev/null; then echo "Reboot needed: no"; else echo "Reboot needed: yes - reboot in 1 minute"; shutdown -r +1; fi'
          )
          @{ commands = $commands } | ConvertTo-Json | Set-Content -Encoding ascii ssm-params.json

          $cmdId = aws ssm send-command --region $env:AWS_REGION `
            --instance-ids $env:INSTANCE_ID `
            --document-name AWS-RunShellScript `
            --comment "Weekly updates (block 7)" `
            --timeout-seconds 1800 `
            --parameters file://ssm-params.json `
            --query "Command.CommandId" --output text
          if ($LASTEXITCODE -ne 0) { throw "send-command failed" }
          Write-Host "SSM command id: $cmdId"

          aws ssm wait command-executed --region $env:AWS_REGION --command-id $cmdId --instance-id $env:INSTANCE_ID
          $status = aws ssm get-command-invocation --region $env:AWS_REGION --command-id $cmdId --instance-id $env:INSTANCE_ID --query Status --output text
          aws ssm get-command-invocation --region $env:AWS_REGION --command-id $cmdId --instance-id $env:INSTANCE_ID --query StandardOutputContent --output text
          if ($status -ne "Success") {
            aws ssm get-command-invocation --region $env:AWS_REGION --command-id $cmdId --instance-id $env:INSTANCE_ID --query StandardErrorContent --output text
            throw "Update of the database server failed (status: $status)"
          }
          Write-Host "Database server updated"