name: Deploy Application

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    env:
      AWS_REGION: eu-west-1
      ECR_REPOSITORY: innovatech-cs1-dev-nginx
      ECS_CLUSTER: innovatech-cs1-dev-cluster
      ECS_SERVICE: innovatech-cs1-dev-nginx-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve ECR registry URL
        run: |
          $accountId = (aws sts get-caller-identity --query Account --output text)
          $registry = "$accountId.dkr.ecr.$env:AWS_REGION.amazonaws.com"
          echo "REGISTRY=$registry" >> $env:GITHUB_ENV

      - name: Log in to ECR
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%p in (`aws ecr get-login-password --region %AWS_REGION%`) do (echo %%p| docker login --username AWS --password-stdin %REGISTRY%)

      - name: Build Docker image
        run: |
          $image = "${env:ECR_REPOSITORY}:latest"
          docker build -t $image ./app

      - name: Tag and push image
        run: |
          $localImage = "${env:ECR_REPOSITORY}:latest"
          $remoteImage = "$env:REGISTRY/${env:ECR_REPOSITORY}:latest"
          docker tag $localImage $remoteImage
          docker push $remoteImage

      - name: Force new ECS deployment
        run: aws ecs update-service --cluster $env:ECS_CLUSTER --service $env:ECS_SERVICE --force-new-deployment --region $env:AWS_REGION
