# =====================================================================
# DEPLOY INFRASTRUCTURE PIPELINE
# ---------------------------------------------------------------------
# Purpose: every change to the Terraform code is first checked, then
# planned, and only applied to AWS after a human has reviewed the plan.
#
# Stages:   Validate  ->  Plan  ->  Apply (only when started manually)
#
# Each stage is a separate JOB. A job only starts when the job it
# "needs" has succeeded. If a stage fails, the next stages are skipped,
# and GitHub shows exactly WHICH stage failed.
#
# How to use:
# 1. Push a .tf change -> Validate + Plan run, Apply is skipped.
# 2. Read the plan on the run's Summary page.
# 3. If the plan is correct: Actions -> Deploy Infrastructure ->
#    Run workflow. That run does Validate + Plan + Apply.
# =====================================================================

name: Deploy Infrastructure

# ---------------------------------------------------------------------
# WHEN does this pipeline run?
# - push to main, but only if a .tf file changed (path filter)
# - or manually via Actions -> Deploy Infrastructure -> Run workflow
# ---------------------------------------------------------------------
on:
  push:
    branches: [main]
    paths:
      - "**.tf"
  workflow_dispatch:

# ---------------------------------------------------------------------
# Never run two infrastructure pipelines at the same time.
# Two Terraform runs changing the same state file at once can corrupt it.
# cancel-in-progress: false -> a new run WAITS, it does not stop the
# running one halfway through an apply.
# ---------------------------------------------------------------------
concurrency:
  group: deploy-infra
  cancel-in-progress: false

# All run-steps in all jobs use PowerShell (our runner is a Windows laptop)
defaults:
  run:
    shell: powershell

jobs:

  # ===================================================================
  # STAGE 1: VALIDATE
  # Goal: catch mistakes in the code BEFORE we talk to AWS at all.
  # ===================================================================
  validate:
    name: Validate
    runs-on: self-hosted          # runs on the runner on my laptop
    steps:
      # Git for Windows can convert line endings to Windows-style (CRLF)
      # when it checks out files. Terraform then sees the user_data script
      # and the Prometheus config as "changed" text compared to what was
      # applied from the laptop (LF). This setting turns that conversion off.
      - name: Use LF line endings on checkout
        run: git config --global core.autocrlf false

      # Get the code from the repository into the runner's work folder.
      # Note: checkout also CLEANS the folder, so nothing from earlier
      # runs or jobs is left over (that's why every job does this again).
      - name: Checkout
        uses: actions/checkout@v4

      # Safety check: stop the pipeline if any .tf file still has CRLF
      # line endings, instead of silently planning unwanted changes.
      - name: Check line endings (LF only)
        run: |
          $crlf = Get-ChildItem -Recurse -Include *.tf -File | Where-Object { (Get-Content -Raw $_.FullName) -match "`r`n" }
          if ($crlf) {
            $crlf | ForEach-Object { Write-Host $_.FullName }
            throw "Files with Windows (CRLF) line endings found"
          }
          Write-Host "All .tf files use LF line endings"

      # Check the formatting. -check only REPORTS badly formatted files,
      # it does not change them. If this fails: run `terraform fmt -recursive`
      # locally, commit and push again.
      - name: Terraform format check
        run: terraform fmt -check -recursive

      # Download the AWS provider so Terraform understands the code.
      # -backend=false: don't connect to the state file, we only want to
      # check the code here, not look at the real infrastructure.
      - name: Terraform Init (without backend)
        run: terraform init -backend=false -input=false

      # Check the code for errors: wrong variable names, missing
      # arguments, references to resources that don't exist, etc.
      - name: Terraform Validate
        run: terraform validate

  # ===================================================================
  # STAGE 2: PLAN
  # Goal: calculate WHAT would change in AWS, without changing anything,
  # and save that plan so the Apply stage can use exactly this plan.
  # ===================================================================
  plan:
    name: Plan
    runs-on: self-hosted
    needs: validate               # only runs if Validate succeeded
    steps:
      - name: Use LF line endings on checkout
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      # Normal init, this time WITH the backend, because the plan has to
      # compare the code with the real state (C:/tfstate/...tfstate).
      # The state file is outside the repo folder, so checkout doesn't
      # delete it. This only works because all jobs run on the same laptop.
      - name: Terraform Init
        run: terraform init -input=false

      # Make the plan and save it to a file called "tfplan".
      # -input=false: never wait for keyboard input (nobody is typing).
      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      # Show the plan in readable text on the summary page of the run,
      # so the reviewer can read WHAT will change before applying.
      - name: Show plan in run summary
        run: |
          "## Terraform plan" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          terraform show -no-color tfplan | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Jobs don't share files. The next job starts with a cleaned
      # folder, so "tfplan" would be gone. We upload it as an ARTIFACT
      # (a file stored by GitHub for this run) so Apply can download it.
      # retention-days: 1 -> deleted after 1 day, because the plan file
      # can contain sensitive values (e.g. the generated DB password).
      - name: Upload plan file
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  # ===================================================================
  # STAGE 3: APPLY
  # Goal: apply exactly the plan made in the Plan stage - nothing else.
  # ===================================================================
  apply:
    name: Apply
    runs-on: self-hosted
    needs: plan                   # only runs if Plan succeeded

    # APPROVAL: "Required reviewers" (GitHub pauses the run until someone
    # clicks Approve) is not available on a private repo without GitHub Pro.
    # Instead, Apply only runs when the workflow is started MANUALLY
    # ("Run workflow"). A push only runs Validate + Plan, so the plan can
    # be reviewed first. With GitHub Pro (free via the Student Developer
    # Pack), switch back to: environment: infra-approval
    # environment: infra-approval
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Use LF line endings on checkout
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform init -input=false

      # Get the "tfplan" file that the Plan stage uploaded.
      - name: Download plan file
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      # Apply the SAVED plan. No -auto-approve is needed: when you give
      # Terraform a plan file, the plan was already made.
      # Safety: if the infrastructure changed after the plan was made,
      # Terraform refuses with "Saved plan is stale" instead of doing
      # something nobody reviewed.
      - name: Terraform Apply
        run: terraform apply -input=false tfplan